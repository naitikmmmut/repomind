<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002FA7" />
    <meta name="description" content="RepoMind – Codebase Archaeologist" />
    <title>RepoMind</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    </noscript>

    <style>
      :root {
        --background: 210 20% 98%;
        --foreground: 222 84% 5%;
        --card: 0 0% 100%;
        --card-foreground: 222 84% 5%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 84% 5%;
        --primary: 226 100% 33%;
        --primary-foreground: 0 0% 100%;
        --secondary: 210 40% 96%;
        --secondary-foreground: 222 84% 5%;
        --muted: 210 40% 96%;
        --muted-foreground: 215 16% 35%;
        --accent: 210 40% 96%;
        --accent-foreground: 222 84% 5%;
        --destructive: 12 100% 50%;
        --destructive-foreground: 0 0% 100%;
        --border: 214 32% 91%;
        --input: 214 32% 91%;
        --ring: 226 100% 33%;
        --radius: 0px;
        --surface-hover: 210 40% 96%;
      }

      body {
        margin: 0;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 48px;
      }

      .loading-logo {
        width: 64px;
        height: 64px;
        background: #002FA7;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        color: white;
        font-family: 'IBM Plex Mono', monospace;
        font-weight: bold;
        font-size: 24px;
      }

      .loading-title {
        font-family: 'Chivo', sans-serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.025em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .loading-subtitle {
        font-size: 14px;
        color: hsl(var(--muted-foreground));
        max-width: 400px;
        line-height: 1.5;
      }

      .sidebar-skeleton {
        display: none;
      }

      @media (min-width: 769px) {
        .loading-wrapper {
          display: flex;
          height: 100vh;
        }
        .sidebar-skeleton {
          display: block;
          width: 280px;
          min-width: 280px;
          background: hsl(var(--card));
          border-right: 1px solid hsl(var(--border));
        }
        .loading-container {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading-wrapper">
        <div class="sidebar-skeleton"></div>
        <div class="loading-container">
          <div class="loading-logo">RM</div>
          <h1 class="loading-title">REPOMIND</h1>
          <p class="loading-subtitle">Codebase Archaeologist is initializing...</p>
        </div>
      </div>
    </div>
  </body>
</html>
