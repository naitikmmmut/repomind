<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002FA7" />
    <meta name="description" content="RepoMind – Codebase Archaeologist" />
    <title>RepoMind</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Pre-rendered EmptyState: paints instantly before JS loads, React replaces seamlessly -->
      <div style="display:flex;height:100vh;overflow:hidden">
        <div class="sidebar" style="display:none"></div>
        <main class="main-content">
          <div class="empty-state">
            <div style="width:64px;height:64px;background:#002FA7;display:flex;align-items:center;justify-content:center;margin-bottom:24px">
              <span style="color:white;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:bold">RM</span>
            </div>
            <h2 style="font-size:24px;font-weight:900;letter-spacing:-0.025em;font-family:'Chivo',sans-serif;margin-bottom:8px;text-transform:uppercase">
              CODEBASE ARCHAEOLOGIST
            </h2>
            <p style="font-size:14px;color:hsl(215 16% 35%);max-width:400px;margin-bottom:32px;line-height:1.5">
              Ingest any public GitHub repository and ask intelligent questions about its code.
              Understand architecture, find bugs, and explore functions.
            </p>
            <div class="btn-primary" style="display:inline-block">INGEST YOUR FIRST REPO</div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
